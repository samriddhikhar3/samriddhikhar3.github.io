project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - resume.qmd
    - portfolio/portfolio.qmd
    - portfolio/*/index.qmd
  resources:
    - "assets/live/**"
  preview:
    port: 3333
website:
  title: "Samriddhi Khare"
  site-url: "https://samriddhikhar3.github.io/"
  repo-url: "samriddhikhar3.github.io"
  repo-actions: [source]
  description: "Urban Planner and Spatial Analyst"
  page-navigation: true
  back-to-top-navigation: false
  twitter-card: true
  search: 
    location: navbar
    type: overlay
  navbar:
    pinned: true
    tools:
    - icon: github
      href: https://github.com/samriddhikhar3
    - icon: linkedin
      href: https://www.linkedin.com/in/samriddhi-khare-3668821b1/
    right:
      - text: Home
        aria-label: "Home"
        href: index.qmd
      - text: Resume
        aria-label: "Resume"
        href: resume.qmd
      - text: Portfolio
        aria-label: "Portfolio"
        href: portfolio/portfolio.qmd

  page-footer:  
    center: >-
     Made with ❤️ and [Quarto](https://quarto.org)

format: 
  html: 
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5rem
    link-external-newwindow: true
    theme:
      light: cosmo
      dark: [cosmo, theme-dark.scss]
    highlight-style: solarized
    code-link: true
    code-copy: true
    toc: true
    pagetitle: "{{< meta title >}} | Samriddhi Khare"
    css: assets/live/live.css
    include-in-header: _includes/color-scheme.html
    include-after-body: _includes/live-loader.html

execute: 
  freeze: auto
  cache: true

